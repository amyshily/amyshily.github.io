<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scrapbook — Amy Ly</title>
  <script>
    (function() {
      try {
        var storedTheme = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = storedTheme || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=20260808-page" />
  <link rel="stylesheet" href="adventures.css?v=20260830" />
  <link rel="stylesheet" href="scrapbook.css?v=20260908-back" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Playpen+Sans:wght@400;600&family=Patrick+Hand&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet" />
</head>
<body class="scrapbook-body">
  <div class="paper-room" aria-hidden="true">
    <div class="paper-grain paper-grain-coarse"></div>
    <div class="paper-grain paper-grain-fine"></div>
    <div class="paper-wash paper-wash-a"></div>
    <div class="paper-wash paper-wash-b"></div>
    <div class="paper-wash paper-wash-c"></div>
    <div class="paper-pulp"></div>
    <div class="paper-fibers"></div>
    <div class="paper-flecks"></div>
    <div class="paper-scuff"></div>
  </div>

  <nav class="navbar scrapbook-navbar" id="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">A<span>L</span></a>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html#about">About</a></li>
        <li><a href="index.html#experience">Experience</a></li>
        <li><a href="index.html#involvement">Involvement</a></li>
        <li><a href="index.html#projects">Personal Projects</a></li>
        <li><a href="index.html#skills">Skills</a></li>
        <li><a href="adventures.html" class="active">Side Quests</a></li>
        <li><a href="index.html#contact">Contact</a></li>
      </ul>
      <div class="nav-actions">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
          <span class="theme-toggle-track" aria-hidden="true">
            <span class="theme-toggle-thumb"></span>
          </span>
          <span class="theme-toggle-text">Light</span>
        </button>
        <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </nav>

  <main class="scrapbook-main">
    <p class="scrapbook-back adventures-eyebrow"><a href="adventures.html" class="garage-back">← Side Quests</a></p>
    <div class="scrapbook-stage">
      <button class="scrapbook-nav scrapbook-nav-prev" id="scrapbook-prev" type="button" aria-label="Previous page">
        <span aria-hidden="true">‹</span>
      </button>

      <div class="scrapbook-book-frame">
        <div class="scrapbook-book" id="scrapbook-book" aria-label="Scrapbook">
          <div class="book-base book-base-left" aria-hidden="true"></div>
          <div class="book-base book-base-right" aria-hidden="true"></div>
          <div class="scrapbook-spine" aria-hidden="true"></div>

        <article class="scrapbook-page" data-page="0">
          <div class="page-face page-front">
            <div class="blank-page blank-cover cover-photo">
              <img src="images/scrapbook-cover.png" alt="Amy Book scrapbook cover" />
            </div>
            <span class="page-curl" aria-hidden="true"></span>
            <span class="page-sheen" aria-hidden="true"></span>
          </div>
          <div class="page-face page-back" aria-hidden="true">
            <span class="page-sheen page-sheen-back" aria-hidden="true"></span>
          </div>
        </article>

        <article class="scrapbook-page" data-page="1">
          <div class="page-face page-front">
            <div class="blank-page">
              <span class="blank-tape blank-tape-tl" aria-hidden="true"></span>
            </div>
            <span class="page-curl" aria-hidden="true"></span>
            <span class="page-sheen" aria-hidden="true"></span>
          </div>
          <div class="page-face page-back" aria-hidden="true">
            <span class="page-sheen page-sheen-back" aria-hidden="true"></span>
          </div>
        </article>

        <article class="scrapbook-page" data-page="2">
          <div class="page-face page-front">
            <div class="blank-page">
              <span class="blank-washi blank-washi-soft" aria-hidden="true"></span>
            </div>
            <span class="page-curl" aria-hidden="true"></span>
            <span class="page-sheen" aria-hidden="true"></span>
          </div>
          <div class="page-face page-back" aria-hidden="true">
            <span class="page-sheen page-sheen-back" aria-hidden="true"></span>
          </div>
        </article>

        <article class="scrapbook-page" data-page="3">
          <div class="page-face page-front">
            <div class="blank-page">
              <span class="blank-tape blank-tape-tr" aria-hidden="true"></span>
            </div>
            <span class="page-curl" aria-hidden="true"></span>
            <span class="page-sheen" aria-hidden="true"></span>
          </div>
          <div class="page-face page-back" aria-hidden="true">
            <span class="page-sheen page-sheen-back" aria-hidden="true"></span>
          </div>
        </article>

        <article class="scrapbook-page" data-page="4">
          <div class="page-face page-front">
            <div class="blank-page blank-end">
              <span class="blank-washi blank-washi-end" aria-hidden="true"></span>
            </div>
            <span class="page-curl" aria-hidden="true"></span>
            <span class="page-sheen" aria-hidden="true"></span>
          </div>
          <div class="page-face page-back">
            <div class="blank-page blank-cover blank-back-cover">
              <span class="blank-washi blank-washi-lilac" aria-hidden="true"></span>
              <span class="blank-washi blank-washi-rose" aria-hidden="true"></span>
            </div>
            <span class="page-sheen page-sheen-back" aria-hidden="true"></span>
          </div>
        </article>
        </div>
      </div>

      <button class="scrapbook-nav scrapbook-nav-next" id="scrapbook-next" type="button" aria-label="Next page">
        <span aria-hidden="true">›</span>
      </button>
    </div>

    <div class="scrapbook-dots" id="scrapbook-dots" role="tablist" aria-label="Scrapbook pages"></div>
  </main>

  <script src="script.js?v=20260808-page"></script>
  <script src="scrapbook.js?v=20260820-size"></script>
</body>
</html>
